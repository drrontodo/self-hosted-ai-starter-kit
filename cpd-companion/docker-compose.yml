# The SQLite database lives on a named volume (reliable WAL locking on Docker
# Desktop for Windows); files you interact with from Windows are bind-mounted
# as subfolders of ./data so drain_whisper.py and your backup routine can see
# them.
services:
  cpd-companion:
    build: .
    container_name: cpd-companion
    restart: unless-stopped
    ports:
      - "8340:8340"
    env_file: .env
    environment:
      - CPD_DATA_DIR=/data
    volumes:
      - cpd_data:/data
      - ./data/backups:/data/backups
      - ./data/evidence:/data/evidence
      - ./data/audio:/data/audio
      - ./data/transcripts:/data/transcripts
      - ./data/inbox:/data/inbox

volumes:
  cpd_data:
